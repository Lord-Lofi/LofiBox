# Runs on every pull request and every push to main.
# The job name "check" is the required status check in the "main – review" ruleset.
# Replace the placeholder step with the project's real build and tests,
# but keep the job name, or pass --check NAME to apply-baseline.sh.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Placeholder check (replace with build and tests)
        run: test -f README.md
